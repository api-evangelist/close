  - date: '2026-07-21'
    title: '`user_id` and `is_group_number` deprecated on phone numbers'
    kind: deprecation
    breaking: false
    url: https://developer.close.com/api/overview/changelog/2026/7/21
    highlights: >-
      The group-vs-personal phone-number distinction is being retired. The
      `sharing` field on POST /phone_number/request/internal/ is deprecated and
      now optional (defaults to `personal`). `user_id` and `is_group_number` on
      the Phone Number API are deprecated. Removal is announced for "a future
      update" with no dated sunset.
  - date: '2026-07-16'
    title: Membership creation security enhancement
    kind: behavior-change
    breaking: true
    url: https://developer.close.com/api/overview/changelog/2026/7/16
    highlights: >-
      Creating a membership via the API now requires the organization to have
      "Restrict new users to emails from these domains" enabled, and the new
      member's email must be on a verified domain. Membership creation now also
      supports API-key auth (partially reversing the 2024-06-10 restriction).
