  close.com/changelog. Each entry is its own page under
  /api/overview/changelog/<year>/<month>/<day> and is available as markdown by
  appending .md. Entries are prose announcements, not semantic version bumps —
  Close ships additively into v1 and there is no version number attached to a
  release.
