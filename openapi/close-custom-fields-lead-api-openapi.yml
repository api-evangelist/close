openapi: 3.2.0
info:
  description: Close CRM REST API
  title: Close Custom Fields.lead API
  version: 1.0.0
servers:
- url: https://api.close.com/api/v1
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
