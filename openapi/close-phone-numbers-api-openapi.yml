openapi: 3.2.0
info:
  description: Close CRM REST API
  title: Close Phone Numbers API
  version: 1.0.0
servers:
- url: https://api.close.com/api/v1
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: phone_numbers
  externalDocs:
    url: https://developer.close.com/api/resources/phone-numbers
paths:
  /phone_number/:
    get:
      operationId: phone_numbers_list
      tags:
      - phone_numbers
      summary: List or search for phone numbers
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SkipParam'
      - $ref: '#/components/parameters/FieldsParam'
      - in: query
        name: number
        required: false
        schema:
          title: Number
          default: null
          anyOf:
          - type: string
          - type: 'null'
      - in: query
        name: user_id
        required: false
        description: Deprecated. Use `participant_user_id` instead. The distinction between personal and group numbers is being removed, and `user_id` will be removed in a future update.
        schema:
          title: User ID
          default: null
          anyOf:
          - type: string
          - type: 'null'
          deprecated: true
      - in: query
        name: is_group_number
        required: false
        description: Deprecated. Use `participant_user_id` instead. The distinction between personal and group numbers is being removed, and `is_group_number` will be removed in a future update.
        schema:
          title: Is Group Number
          default: null
          anyOf:
          - type: boolean
          - type: 'null'
          deprecated: true
      - in: query
        name: participant_user_id
        required: false
        description: Return numbers the given user participates in, including both personal and group numbers they belong to.
        schema:
          title: Participant User ID
          default: null
          anyOf:
          - type: string
          - type: 'null'
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - address_id: null
                  bundle_id: null
                  carrier: null
                  carrier_type: null
                  country: US
                  date_created: '2016-07-18T22:54:24.787000+00:00'
                  date_updated: '2016-07-18T22:55:55.938000+00:00'
                  forward_to: null
                  forward_to_enabled: false
                  forward_to_formatted: null
                  id: phon_asdjkfev50ZKOqTVndOFN4effzv99vDvpDxrks9XLU3
                  inbound_ring_duration: null
                  is_group_number: false
                  is_premium: false
                  is_verified: true
                  label: Primary Number
                  last_billed_price: null
                  mms_enabled: true
                  next_billing_on: null
                  number: '+16503335555'
                  number_formatted: +1 650-333-5555
                  organization_id: orga_RbREgmiiwcr1w2b4cOnCMQaQPSIFxMqAD2Dh243uxcH
                  participants: []
                  phone_numbers:
                  - '+16508889898'
                  phone_numbers_formatted:
                  - +1 650-888-9898
                  press_1_to_accept: false
                  sms_enabled: true
                  supports_mms_to_countries:
