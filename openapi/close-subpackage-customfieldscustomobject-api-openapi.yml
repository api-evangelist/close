  schemas:
    custom_fields.custom_object_create_Response_201:
      type: object
      properties: {}
      description: Empty response body
      title: custom_fields.custom_object_create_Response_201
    custom_fields.custom_object_get_Response_200:
      type: object
      properties: {}
      description: Empty response body
