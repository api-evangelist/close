    custom_fields.lead_list_Response_200:
      type: object
      properties: {}
      description: Empty response body
      title: custom_fields.lead_list_Response_200
    custom_fields.lead_create_Response_200:
      type: object
      properties: {}
      description: Empty response body
      title: custom_fields.lead_create_Response_200
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: basic
      description: Use your API key as the username and leave the password empty.
    OAuth2:
      type: http
      scheme: bearer
