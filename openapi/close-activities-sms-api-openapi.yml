      type: object
      properties:
        activity_at:
          type:
          - 'null'
          - string
          format: date-time
        attachments:
          type:
          - array
          - 'null'
          maxItems: 10
          items:
            type: object
            properties:
              content_type:
                type: string
                enum:
                - application/pdf
                - application/vcard
                - audio/3gpp
                - audio/3gpp2
                - audio/L24
                - audio/ac3
                - audio/amr
                - audio/amr-nb
                - audio/basic
                - audio/mp4
                - audio/mpeg
                - audio/ogg
                - audio/vnd.rn-realaudio
                - audio/vnd.wave
                - audio/webm
                - image/bmp
                - image/gif
                - image/jpeg
                - image/jpg
                - image/png
                - image/tiff
                - text/calendar
                - text/csv
                - text/directory
                - text/richtext
                - text/rtf
                - text/vcard
                - text/x-vcard
                - video/3gpp
                - video/3gpp-tt
                - video/3gpp2
                - video/H261
                - video/H263
                - video/H263-1998
                - video/H263-2000
                - video/H264
                - video/mp4
                - video/mpeg
                - video/quicktime
                - video/webm
              filename:
                type: string
              url:
                type: string
            required:
            - content_type
            - filename
            - url
        contact_id:
          type:
          - 'null'
          - string
        created_by:
          type:
          - 'null'
          - string
        date_created:
