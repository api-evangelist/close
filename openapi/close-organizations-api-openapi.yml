components:
  schemas:
    InlineLeadStatusPayload:
      title: InlineLeadStatusPayload
      description: Reference to an existing lead status by `id`.
      type: object
      properties:
        id:
          title: ID
          description: ID of an existing lead status.
          type: string
        label:
          title: Label
          description: Label of the lead status.
          type: string
    Organization:
      title: Organization
      description: Editable organization settings.
      type: object
      properties:
        currency:
          title: Currency
          description: Default currency as a three-letter [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) currency code.
          type: string
        enable_unsubscribe_link:
          title: Enable Unsubscribe Link
          description: Enable the unsubscribe link by default in new email templates.
          type: boolean
        lead_statuses:
          title: Lead Statuses
          description: The organization's lead statuses. Provide the full list in the desired order to reorder them.
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/InlineLeadStatusPayload'
        name:
          title: Name
          description: The organization's name.
          type: string
          minLength: 1
        require_unsubscribe_link:
          title: Require Unsubscribe Link
          description: Require an unsubscribe link in Bulk Emails and Workflows.
          type: boolean
      additionalProperties: false
  securitySchemes:
    ApiKeyAuth:
      description: Use your API key as the username and leave the password empty.
      scheme: basic
      type: http
    OAuth2:
      flows:
        authorizationCode:
          authorizationUrl: https://app.close.com/oauth2/authorize/
          scopes:
            all.full_access: Full access to all resources
            offline_access: Request a refresh token
          tokenUrl: https://api.close.com/oauth2/token/
      type: oauth2
