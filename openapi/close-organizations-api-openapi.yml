      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: _expand
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                created_by: null
                date_created: '2013-02-01T00:54:51.097000+00:00'
                date_updated: '2013-02-20T04:38:01.961000+00:00'
