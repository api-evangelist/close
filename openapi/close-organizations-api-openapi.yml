paths:
  /organization/{id}/:
    get:
      operationId: organizations_get
      tags:
      - organizations
      summary: Get an organization's details
      description: By default, `memberships` and `inactive_memberships` are populated with user data prefixed with `user_`. If you'd rather have a nested `user` field, use a query string like `?_expand=memberships__user,inactive_memberships__user`.
