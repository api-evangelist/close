          - 'null'
        contact_id:
          type:
          - string
          - 'null'
        created_by:
          type:
          - string
          - 'null'
        custom_fields:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
        date_created:
          type:
          - string
          - 'null'
          format: date-time
        date_won:
          type:
          - string
          - 'null'
          format: date-time
        lead_id:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
        pipeline_id:
          type:
          - string
          - 'null'
          description: Specify which pipeline this opportunity should belong to. When supplied without `status_id`, the opportunity will be created with the first available status of that pipeline. When supplied with `status_id`, the status must belong to the specified pipeline or a 400 error will be returned. If the pipeline does not exist, a 400 error will be returned. See the [Pipelines API](https://developer.close.com/api/resources/pipelines).
        status_id:
          type:
          - string
          - 'null'
          description: Post a `status_id` to create an opportunity with a specific status. If omitted, the organization's default (first) status will be used (or the first status of the `pipeline_id` if provided). See the [Opportunity Status API](https://developer.close.com/api/resources/opportunity-statuses).
        user_id:
          type:
          - string
          - 'null'
        value:
          type:
          - integer
          - 'null'
        value_period:
          oneOf:
          - $ref: '#/components/schemas/OpportunityValuePeriod'
          - type: 'null'
      title: CreateOpportunity
