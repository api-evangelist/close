components:
  schemas:
    StalledOpportunityActionTypeV2:
      type: string
      enum:
      - change_status
      - adjust_close_date
      - follow_up_email
      - follow_up_call
      - follow_up_sms
      title: StalledOpportunityActionTypeV2
    AttachmentIn:
      type: object
