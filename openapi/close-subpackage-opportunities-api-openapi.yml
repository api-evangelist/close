      - message_draft
      - subject_draft
      title: OpportunityFollowUpEmailActionDetails
    OpportunityValuePeriod:
      type: string
      enum:
      - one_time
      - monthly
      - annual
      title: OpportunityValuePeriod
    opportunities_list_Response_200:
      type: object
