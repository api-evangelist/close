components:
  schemas:
    ContactPhone:
      title: ContactPhone
      type: object
      properties:
        country:
          title: Country
          anyOf:
          - type: string
          - type: 'null'
        outbound_sms_blocked:
          title: Outbound SMS Blocked
          type: boolean
        phone:
          title: Phone
          type: string
        phone_formatted:
          title: Phone Formatted
          type: string
        type:
          title: Type
          type: string
        tz_ids:
          title: TZ IDs
          type: array
          items:
            type: string
      required:
      - phone
      - type
    CreateContact:
      type: object
      properties:
        created_by:
          type:
          - 'null'
          - string
        date_created:
          type:
          - 'null'
          - string
          format: date-time
        emails:
          type:
          - array
          - 'null'
          maxItems: 100
          items:
            type: object
            properties:
              email:
                type: string
                format: email
              type:
                type: string
            required:
            - email
        lead_id:
          type:
          - 'null'
          - string
        name:
          type:
          - 'null'
          - string
          maxLength: 1000
        phones:
          type:
          - array
          - 'null'
          maxItems: 100
          items:
            type: object
            properties:
              phone:
                description: Phone number in E.164 format
                type:
                - 'null'
                - string
              type:
                type: string
        timezone:
          description: IANA timezone identifier
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
          maxLength: 1000
        urls:
          type:
          - array
          - 'null'
          maxItems: 100
          items:
            type: object
            properties:
              type:
                type: string
              url:
                type: string
                format: uri
            required:
            - url
      additionalProperties: false
      patternProperties:
        ^custom\.:
          not:
            type: object
    WorkflowRunStatus:
      title: WorkflowRunStatus
      type: string
      enum:
      - active
      - paused
      - finished
      - goal
      - error
    ContactUrl:
      title: ContactUrl
      type: object
      properties:
        type:
          title: Type
          type: string
        url:
          title: URL
          type: string
      required:
      - type
      - url
    Contact:
      title: Contact
      type: object
      properties:
        created_by:
          title: Created By
          anyOf:
          - type: string
          - type: 'null'
        date_created:
          title: Date Created
          type: string
          format: date-time
        date_updated:
          title: Date Updated
          type: string
          format: date-time
        display_name:
          title: Display Name
          type: string
        emails:
          title: Emails
          type: array
          items:
            $ref: '#/components/schemas/ContactEmail'
        id:
          title: ID
          type: string
        integration_links:
          title: Integration Links
          type: array
          items:
            $ref: '#/components/schemas/RenderedIntegrationLink'
        lead_id:
          title: Lead ID
          default: null
          anyOf:
          - type: string
          - type: 'null'
        lead_suggestions_operation_id:
          title: Lead Suggestions Operation ID
          anyOf:
          - type: string
          - type: 'null'
        name:
          title: Name
          anyOf:
          - type: string
          - type: 'null'
        organization_id:
          title: Organization ID
          type: string
        phones:
          title: Phones
          type: array
          items:
            $ref: '#/components/schemas/ContactPhone'
        recent_calls:
          title: Recent Calls
          type: array
          items:
            $ref: '#/components/schemas/ContactRecentCall'
        subscriptions:
          title: Subscriptions
          type: array
          items:
            $ref: '#/components/schemas/BasicSubscriptionInfoForContact'
        timezone:
          title: Timezone
          anyOf:
          - type: string
          - type: 'null'
        timezone_source:
          title: Timezone Source
          anyOf:
          - type: string
          - type: 'null'
        title:
          title: Title
          anyOf:
          - type: string
          - type: 'null'
        updated_by:
          title: Updated By
          anyOf:
          - type: string
          - type: 'null'
        urls:
          title: URLs
          type: array
          items:
            $ref: '#/components/schemas/ContactUrl'
      required:
      - created_by
      - date_created
      - date_updated
      - display_name
      - id
      - name
      - organization_id
      - title
      - updated_by
    CallStatus:
      title: CallStatus
      description: Current status of the call.
      type: string
      enum:
      - created
      - in-progress
      - completed
      - cancel
      - no-answer
      - busy
      - failed
      - timeout
    UpdateContact:
      type: object
      properties:
        emails:
          type:
          - array
          - 'null'
          maxItems: 100
          items:
            type: object
            properties:
              email:
                type: string
                format: email
              type:
                type: string
            required:
            - email
        lead_id:
          type:
          - 'null'
          - string
        name:
          type:
          - 'null'
          - string
          maxLength: 1000
        phones:
          type:
          - array
          - 'null'
          maxItems: 100
          items:
            type: object
            properties:
              phone:
                description: Phone number in E.164 format
                type:
                - 'null'
                - string
              type:
                type: string
        timezone:
          description: IANA timezone identifier
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
          maxLength: 1000
        urls:
          type:
          - array
          - 'null'
          maxItems: 100
          items:
            type: object
            properties:
              type:
                type: string
              url:
                type: string
                format: uri
            required:
            - url
      additionalProperties: false
      patternProperties:
        ^custom\.:
          not:
            type: object
    StatusReason:
      title: StatusReason
      description: Reason for each higher level status on a Workflow run.
      type: string
      enum:
      - manual
      - pending-call-timed-out
      - bulk-action
      - rate-limited
      - sequence-deleted
      - workflow-paused
      - filter-not-matched
      - insufficient-ai-credit-balance
      - reply-received
      - call-answered
      - meeting-booked
      - lead-status-changed
      - outcome-met
      - account-invalid
      - account-failures
      - sending-throttled-too-long
      - membership-inactive
      - send-as-error
      - email-bounced
      - call-failed
      - sms-failed
      - no-user-phone
      - billing-error
      - assignment-field-invalid
      - lead-status-field-invalid
      - assignees-missing
      - run-as-disabled
      - lead-not-visible
      - internal-error
      - field-mapping-error
      - filter-config-invalid
      - email-ai-generation-failed
    WorkflowStatus:
      title: WorkflowStatus
      type: string
      enum:
      - active
      - paused
      - draft
    BasicSubscriptionInfoForContact:
      title: BasicSubscriptionInfoForContact
      type: object
      properties:
        contact_email:
          title: Contact Email
          anyOf:
          - type: string
          - type: 'null'
        date_created:
          title: Date Created
          type: string
          format: date-time
        initial_email_id:
          title: Initial Email ID
          anyOf:
          - type: string
          - type: 'null'
        sequence_id:
          title: Sequence ID
          type: string
        sequence_name:
          title: Sequence Name
          type: string
        sequence_status:
          $ref: '#/components/schemas/WorkflowStatus'
        start_date:
          title: Start Date
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        subscription_id:
          title: Subscription ID
          type: string
        subscription_status:
          $ref: '#/components/schemas/WorkflowRunStatus'
        subscription_status_reason:
          anyOf:
          - $ref: '#/components/schemas/StatusReason'
          - type: 'null'
      required:
      - contact_email
      - date_created
      - initial_email_id
      - sequence_id
      - sequence_name
      - sequence_status
      - start_date
      - subscription_id
      - subscription_status
      - subscription_status_reason
    ContactEmail:
      title: ContactEmail
      type: object
      properties:
        email:
          title: Email
          type: string
        is_unsubscribed:
          title: Is Unsubscribed
          type: boolean
        type:
          title: Type
          type: string
      required:
      - email
      - is_unsubscribed
      - type
    ContactRecentCall:
      title: ContactRecentCall
      type: object
      properties:
        dialer_id:
          title: Dialer ID
          anyOf:
          - type: string
          - type: 'null'
        duration:
          title: Duration
          type: integer
        finish_timestamp:
          title: Finish Timestamp
          type: string
          format: date-time
        id:
          title: ID
          type: string
        status:
          $ref: '#/components/schemas/CallStatus'
      required:
      - dialer_id
      - duration
      - finish_timestamp
      - id
      - status
    RenderedIntegrationLink:
      title: RenderedIntegrationLink
      type: object
      properties:
        name:
          title: Name
          type: string
        url:
          title: Url
          type: string
