  /contact/{id}/:
    get:
      operationId: contacts_get
      tags:
      - contacts
      summary: Fetch a single contact
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/FieldsParam'
      responses:
        '200':
          content:
            application/json:
              example:
                created_by: user_N6KhMpzHRCYQHdn4gRNIFNN5JExnsrprKA6ekxM63XA
                date_created: '2013-02-20T05:44:35.625000+00:00'
