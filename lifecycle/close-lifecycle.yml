  sunset_header: false
  deprecation_header: false
  practice: announced-in-changelog
  note: >-
    Close does not publish a deprecation policy document, and does not emit
    RFC 8594 Sunset or Deprecation response headers. What it does do
    consistently is announce field- and endpoint-level deprecations on the dated
    API changelog, with a stated migration path and a "will be removed in a
    future update" horizon — real notice, but no committed date and no
    machine-readable signal an agent could detect at runtime.
