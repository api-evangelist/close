method: derived
source: mcp/close-mcp.yml + openapi/_original/close-api-openapi.json
description: Binds each of the 107 tools Close publishes for its hosted MCP server to the operationId(s)
  in the Close OpenAPI that back it, so an agent can recover a real input contract for a tool whose live
  inputSchema is OAuth-gated. Mappings were made by name and documented semantics against the published
  tool reference; the live tools/list is auth-gated (HTTP 401), so no schema was copied and none was invented.
surfaces:
  openapi:
    file: openapi/_original/close-api-openapi.json
    url: https://api.close.com/api/openapi.json
    operations: 300
    gated: false
    note: Close labels this spec experimental and says it does not carry 100% request/response schema
      coverage.
  mcp:
    url: https://mcp.close.com/mcp
    transport: HTTP Streamable
    tools: 107
    gated: true
    note: tools/list returns 401 without an OAuth token or Close-API-Key header.
  graphql: null
  advanced_filtering:
    url: https://developer.close.com/api/resources/advanced-filtering
    in_openapi: false
    note: Documented REST surface that is absent from the published OpenAPI; it backs the MCP search and
      paginate_search tools.
