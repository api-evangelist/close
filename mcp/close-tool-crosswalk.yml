mcp_only:
- tool: aggregation
  category: mcp.read
  reason: Server-side aggregation engine over Close objects. The REST reporting endpoints return fixed
    predefined reports; there is no general-purpose aggregation operation.
- tool: close_product_knowledge_search
  category: mcp.read
  reason: Retrieval over Close product documentation and the knowledge base. Not a CRM data operation
    and has no REST surface.
- tool: customized_builtin_labels
  category: mcp.read
  reason: Returns renamed built-in object labels for the org. No REST operation exposes this.
- tool: find_agent_configs
  category: mcp.read
  reason: Voice agent (Chloe) inventory. The AI-caller surface is MCP-only; no voice-agent resource exists
    in the REST API.
- tool: find_voice_agents
  category: mcp.read
  reason: Voice agent (Chloe) inventory. MCP-only, same as find_agent_configs.
- tool: get_fields
  category: mcp.read
  reason: Companion to the aggregation tool that enumerates aggregatable fields. No REST equivalent.
- tool: get_voice_agent_overview_report
  category: mcp.read
  reason: Cross-agent voice funnel rollup. MCP-only; the REST reporting endpoints do not cover voice agents.
- tool: get_voice_agent_performance_report
  category: mcp.read
  reason: Per-agent voice performance metrics. MCP-only.
- tool: get_voice_agents
  category: mcp.read
  reason: Detailed voice agent configuration including objective, instructions and enabled skills. MCP-only.
- tool: paginate_search
  category: mcp.read
  reason: Cursor pagination over a search_id or smart_view_id returned by the search tools. Backed by
    Advanced Filtering, absent from the OpenAPI.
- tool: propose_voice_agent_update
  category: mcp.read
  reason: Turns natural-language feedback into a reviewable voice-agent config proposal. Inherently agent-shaped;
    no REST analogue.
- tool: search
  category: mcp.read
  reason: Natural-language search over leads and contacts. Backed by the Advanced Filtering API, which
    is documented but is not present in the published OpenAPI.
- tool: apply_voice_agent_update
  category: mcp.write_destructive
  reason: Persists a previously proposed voice-agent config change. MCP-only.
- tool: schedule_voice_agent_call
  category: mcp.write_destructive
  reason: Queues an outbound AI call by assigning a call task to a voice agent. The REST task API cannot
    assign to a voice agent.
