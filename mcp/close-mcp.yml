method: searched
status: published
source: https://developer.close.com/mcp
tools_source: https://developer.close.com/mcp/tools
deployment:
  mode: remote
  endpoint: https://mcp.close.com/mcp
  auth: oauth
  verified: probed
  note: >-
    Close ships a first-party hosted remote MCP server. There is no npx/stdio
    package — the only distribution is the HTTPS endpoint, so an agent can reach
    it without any local installation. POST to the endpoint on 2026-08-13
    returned HTTP 401 with
    'WWW-Authenticate: Bearer error="invalid_token", resource_metadata=
    "https://mcp.close.com/.well-known/oauth-protected-resource"',
    which is a correct RFC 9728 challenge and confirms the endpoint is live and
    OAuth-protected.
server:
  name: close
  transport: http
  protocol: HTTP Streamable
  url: https://mcp.close.com/mcp
  sse_supported: false
  sse_note: >-
    Close's own FAQ states SSE is not currently supported and asks teams needing
    it to email support@close.com.
authentication:
  primary: oauth2
  oauth:
    dynamic_client_registration: true
    registration_endpoint: https://api.close.com/oauth2/register/
    authorization_endpoint: https://app.close.com/oauth2/authorize/
    token_endpoint: https://api.close.com/oauth2/token/
    protected_resource_metadata: https://mcp.close.com/.well-known/oauth-protected-resource
    authorization_server_metadata: https://api.close.com/.well-known/oauth-authorization-server
    scopes: [mcp.read, mcp.write_safe, mcp.write_destructive, offline_access]
  alternative:
    kind: api-key
    headers:
      - name: Close-API-Key
        description: A Close API key created under Settings -> Developer -> API Keys.
      - name: Close-Scope
        description: >-
          One of mcp.read, mcp.write_safe or mcp.write_destructive. Determines
          which tools the server exposes for the session.
scopes:
  - scope: mcp.read
    description: Read-only access. Search, fetch and report tools only.
    tool_count: 57
  - scope: mcp.write_safe
    description: Everything in mcp.read plus create/update tools that add data.
    tool_count: 16
    cumulative_tool_count: 73
  - scope: mcp.write_destructive
    description: >-
      Everything in mcp.read and mcp.write_safe plus update, delete and
      irreversible tools (delete_lead, delete_contact, enrich_field,
      schedule_voice_agent_call, apply_voice_agent_update).
    tool_count: 34
    cumulative_tool_count: 107
clients_documented:
  - Claude (org connector + custom connector)
  - Claude Code
  - ChatGPT
  - Cursor
  - VS Code / GitHub Copilot
  - n8n
introspection:
  tools_list: gated
  http_status: 401
  probed: '2026-08-13'
  note: >-
    tools/list requires an OAuth access token or a Close-API-Key header, so the
    live inputSchema for each tool could not be captured anonymously. The tool
    inventory below is transcribed verbatim from Close's published tool
    reference (names + descriptions + scope tier), NOT invented. Input schemas
    require authenticated introspection.
docs_mcp_server:
  url: https://developer.close.com/_mcp/server
  transport: http
  auth: none
  verified: probed
  http_status: 200
  tools:
    - name: searchDocs
      description: >-
        Search the documentation at https://developer.close.com. Returns
        relevant doc passages with source URLs.
      read_only: true
  note: >-
    A SECOND, separate MCP server. This one is anonymous and only searches the
    developer docs; it is not the CRM data server. Recorded here so the two are
    not conflated.
tool_count: 107
