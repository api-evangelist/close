specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Close
providerId: close
created: '2026-05-08'
# Provenance 2026-08-13: originally written by the API Evangelist bulk sweep dated
# 2026-05-08 (roadmap#35). Every tier, price and add-on below was re-read from
# https://www.close.com/pricing on 2026-08-13 and matched exactly, so this artifact
# is upgraded to method: searched. Annual and monthly prices confirmed:
# Solo $9/$19, Essentials $35/$49, Growth $99/$109, Scale $139/$149 per user/month.
method: searched
source: https://www.close.com/pricing
modified: '2026-08-13'
verified: '2026-08-13'
plan_count: 4
addon_count: 3
reconciled: true
tags:
  - CRM
  - Sales Engagement
  - Plans
description: >-
  Close publishes four per-seat-per-month plans (Solo, Essentials, Growth,
  Scale) plus telephony and AI add-ons, and additional organization fees.
  Annual billing offers a discount versus month-to-month.
sources:
  - https://www.close.com/pricing
included_quotas:
  note: >-
    Read from https://www.close.com/pricing on 2026-08-13. AI credits power
    Chloe (Close's AI teammate) and the AI features including field enrichment;
    they refresh monthly with no rollover and additional credits are purchasable.
  ai_credits_per_user_per_month:
    solo: 500
    essentials: 1000
    growth: 1500
    scale: 2000
  ai_credit_pool_ceiling_per_month:
    essentials: 10000
    growth: 15000
    scale: 20000
  leads:
    solo: 10000
    essentials: unlimited
    growth: unlimited
    scale: unlimited
  custom_fields:
    solo: 250
    essentials: 250
    growth: 250
    scale: 250
  custom_activity_instances_per_month:
    growth: 50000
    scale: unlimited
  opportunities_per_lead: 300
  api_access: all plans (API keys or OAuth), including the event log API
  enterprise: >-
    No published enterprise tier. Close directs larger or more complex buyers to
    "Talk to us" for custom pricing via a demo.
  money_back_guarantee_days: 30
plans:
  - id: close-solo
    name: Solo
    type: subscription
    description: Single-user plan capped at 10,000 leads; no workflows.
    entries:
      - label: Per Month (annual)
        name: close_solo_annual
        type: flat
        metric: subscription
        timeFrame: monthly
        unit: 1
        price: '9'
        currency: USD
        userMultiplied: false
      - label: Per Month (monthly)
        name: close_solo_monthly
        type: flat
        metric: subscription
        timeFrame: monthly
        unit: 1
        price: '19'
        currency: USD
        userMultiplied: false
    elements:
      - name: 1 user, 10,000 leads max
      - name: Core CRM features
  - id: close-essentials
    name: Essentials
    type: per-seat
    description: >-
      Per-seat pricing for small teams; unlimited leads and contacts;
      built-in calling, email, and SMS.
    entries:
      - label: Per Seat / Month (annual)
        name: close_essentials_annual
        type: flat
        metric: seats
        timeFrame: monthly
        unit: 1
        price: '35'
        currency: USD
        userMultiplied: true
      - label: Per Seat / Month (monthly)
        name: close_essentials_monthly
        type: flat
        metric: seats
        timeFrame: monthly
        unit: 1
        price: '49'
        currency: USD
        userMultiplied: true
  - id: close-growth
    name: Growth
    type: per-seat
    description: >-
      Adds Chloe AI sales agent, automated workflows, Power Dialer, and
      AI Email Assistant.
    entries:
      - label: Per Seat / Month (annual)
        name: close_growth_annual
        type: flat
        metric: seats
        timeFrame: monthly
        unit: 1
        price: '99'
        currency: USD
        userMultiplied: true
      - label: Per Seat / Month (monthly)
        name: close_growth_monthly
        type: flat
        metric: seats
        timeFrame: monthly
        unit: 1
        price: '109'
        currency: USD
        userMultiplied: true
  - id: close-scale
    name: Scale
    type: per-seat
    description: >-
      Per-seat plan for larger organizations; role-based permissions,
      Predictive Dialer, unlimited call recording. Custom pricing for
      10+ users.
    entries:
      - label: Per Seat / Month (annual)
        name: close_scale_annual
        type: flat
        metric: seats
        timeFrame: monthly
        unit: 1
        price: '139'
        currency: USD
        userMultiplied: true
      - label: Per Seat / Month (monthly)
        name: close_scale_monthly
        type: flat
        metric: seats
        timeFrame: monthly
        unit: 1
        price: '149'
        currency: USD
        userMultiplied: true
  - id: close-premium-phone
    name: Premium Phone Numbers
    type: addon
    description: Premium phone-number lines for caller-ID branding.
    entries:
      - label: Per Line / Month
        name: close_premium_phone
        type: flat
        metric: phone_lines
        timeFrame: monthly
        unit: 1
        price: '19'
        currency: USD
        userMultiplied: false
  - id: close-ai-call-assistant
    name: AI Call Assistant Add-On
    type: addon
    description: AI-powered call summarization and coaching with per-minute usage fee.
    entries:
      - label: Monthly Base
        name: close_ai_assistant_monthly
        type: flat
        metric: addon
        timeFrame: monthly
        unit: 1
        price: '50'
        currency: USD
        userMultiplied: false
      - label: Per Minute
        name: close_ai_assistant_minute
        type: flat
        metric: minutes
        timeFrame: usage
        unit: 1
        price: '0.02'
        currency: USD
        userMultiplied: false
  - id: close-additional-org
    name: Additional Organization
    type: addon
    description: Each additional Close workspace beyond the included one.
    entries:
      - label: Per Org / Month
        name: close_additional_org
        type: flat
        metric: organizations
        timeFrame: monthly
        unit: 1
        price: '50'
        currency: USD
        userMultiplied: false
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
